<!-- Hàm Script bổ sung hỗ trợ bật/tắt ô "Khác" -->
<script>
    function toggleOtherInput(inputId, show) {
        const inputElem = document.getElementById(inputId);
        if (!inputElem) return;

        if (show) {
            inputElem.classList.remove('hidden');
            inputElem.removeAttribute('disabled');
            inputElem.focus();
        } else {
            inputElem.classList.add('hidden');
            inputElem.setAttribute('disabled', 'true');
            inputElem.value = '';
        }
        if (typeof checkAnswered === 'function') checkAnswered();
    }
</script>

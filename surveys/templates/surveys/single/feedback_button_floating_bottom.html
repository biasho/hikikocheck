<!-- Custom CSS --> 
<style> 
  @keyframes pulse-highlight { 
    0%, 100% { transform: scale(1); color: var(--color-primary); } 
    50% { transform: scale(1.3); color: #f97316; } 
  } 
  .animate-icon-pulse { 
    display: inline-block; 
    animation: pulse-highlight 1.5s infinite ease-in-out; 
  } 
  
  /* Hiệu ứng nhúc nhích chỉ tay sang phải mượt mà */ 
  @keyframes point-right-svg { 
    0%, 100% { transform: translateX(0); } 
    50% { transform: translateX(5px); } 
  } 
  .animate-hand-svg { 
    display: inline-block !important; 
    vertical-align: middle !important; 
    animation: point-right-svg 1s infinite ease-in-out !important; 
    /* Fix lỗi một số CSS toàn cục ép scale làm mất tỷ lệ SVG */
    min-width: 16px !important;
    min-height: 16px !important;
  } 
</style> 

<!-- Cấu trúc HTML Khảo sát nổi --> 
<div id="floating-feedback-box" style="position: fixed !important; bottom: 24px !important; right: 16px !important; z-index: 9999 !important;" class="md:right-8 bg-white dark:bg-zinc-900 border border-[var(--color-border)] shadow-2xl rounded-2xl p-4 w-60 text-left transition-all duration-300"> 
  <p class="text-xs text-[var(--color-text-sub)] leading-relaxed"> 
    1 phút chia sẻ để Reconnect 360° tốt hơn. 
    <span class="block mt-1"> 
      <!-- Icon SVG Bàn tay chỉ phải được bảo vệ, chống đè CSS --> 
      <svg class="animate-hand-svg w-4 h-4 mr-1 inline-block align-middle" viewBox="0 0 24 24" style="color: var(--color-primary) !important; fill: currentColor !important;">
        <path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42L16.86 11H5v2z" style="fill: currentColor !important;"></path>
      </svg>
      <a href="{% url 'surveys:survey_detail' slug='phieu-khao-sat-trai-nghiem-nhanh-4' %}" target="_blank" rel="noopener noreferrer" class="font-bold text-[var(--color-primary)] hover:underline inline-flex items-center gap-0.5 align-middle"> 
        Khảo sát trải nghiệm <span class="material-symbols-outlined text-sm animate-icon-pulse">open_in_new</span> 
      </a> 
    </span> 
  </p> 
</div> 

<!-- Script ẩn/hiện nhẹ nhàng trên Mobile --> 
<script> 
  document.addEventListener("DOMContentLoaded", function () { 
    const box = document.getElementById("floating-feedback-box"); 
    const footer = document.querySelector("footer"); 
    if (!box || !footer) return; 
    
    const observer = new IntersectionObserver((entries) => { 
      entries.forEach(entry => { 
        const isMobile = window.innerWidth < 768; 
        if (entry.isIntersecting) { 
          if (isMobile) { 
            box.style.opacity = "0"; 
            box.style.pointerEvents = "none"; 
          } else { 
            const footerRect = footer.getBoundingClientRect(); 
            const overlap = window.innerHeight - footerRect.top; 
            box.style.transform = `translateY(-${overlap}px)`; 
          } 
        } else { 
          box.style.opacity = "1"; 
          box.style.pointerEvents = "auto"; 
          box.style.transform = "translateY(0)"; 
        } 
      }); 
    }, { root: null, threshold: 0 }); 
    observer.observe(footer); 
  }); 
</script>

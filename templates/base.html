{% load static %}
<!DOCTYPE html>
<html lang="vi" data-theme="{% block default_theme %}light{% endblock %}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}HikikoCheck System{% endblock %}</title>

    <!-- 💥 ANTI-FLICKER SCRIPT (ĐẶT NGAY TRÊN CÙNG ĐỂ CHẠY TRƯỚC TẤT CẢ) -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('user-custom-theme');
            if (savedTheme) {
                // Ép data-theme theo Theme người dùng đã chọn ngay lập tức
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>

    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <!-- Static CSS -->
    <link rel="stylesheet" href="{% static 'css/theme.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <style>
        /* CSS hỗ trợ Anti-Flicker cho màu nền HTML gốc */
        html {
            background-color: var(--color-background, #ffffff);
            color: var(--color-text-main, #0d121b);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tab-btn.active {
            border-bottom-color: var(--color-primary, #1152d4);
            color: var(--color-primary, #1152d4);
            font-weight: 600;
        }

        .theme-btn-active {
            background-color: var(--color-background, #f3f4f6) !important;
            font-weight: 700;
        }
    </style>
    {% block extra_css %}{% endblock %}
    <!-- Chart.js Core -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Plugin Annotation (Nếu muốn vẽ đường gạch đứt mốc điểm người dùng) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
</head>

<body
    class="bg-[var(--color-background)] text-[var(--color-text-main)] font-display min-h-screen flex flex-col overflow-x-hidden">

    <!-- 1. HEADER & NAVBAR -->
    {% include 'includes/header.html' %}

    <!-- 2. MAIN CONTENT -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- 3. FOOTER -->
    {% include 'includes/footer.html' %}

    <!-- GLOBAL TAB SWITCHING SCRIPT -->
    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            const targetContent = document.getElementById('content-' + tabId);
            if (targetContent) targetContent.classList.add('active');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'border-b-2', 'border-primary', 'text-primary');
                btn.classList.add('border-transparent');
            });
            const activeBtn = document.getElementById('tab-' + tabId);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('border-transparent');
            }
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>

<!-- templates/includes/nav_links.html -->

<!-- Trang chủ -->
<a class="w-fit flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm transition-all duration-200
          {% if request.resolver_match.url_name == 'home' %}
              bg-[var(--color-primary)]/10 text-[var(--color-primary)] font-semibold
          {% else %}
              text-[var(--color-text-main)] font-medium hover:bg-gray-100 dark:hover:bg-gray-800
          {% endif %}"
   href="{% url 'pages:home' %}">
    <span class="material-symbols-outlined text-xl shrink-0">home</span>
    <span>Trang chủ</span>
</a>

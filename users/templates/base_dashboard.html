<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Dashboard | Reconnect 360°{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 1. Bật chế độ dark mode dựa trên class cho Tailwind -->
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <!-- 2. Mặc định bật Dark Mode nếu người dùng chưa chọn sang 'light' -->
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-gray-800 dark:text-gray-100 flex h-screen overflow-hidden font-sans relative transition-colors duration-200">

  <!-- Lớp phủ mờ nền khi bật Menu trên Mobile -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-20 hidden md:hidden transition-opacity"></div>

  <!-- Nhúng Sidebar từ thư mục users/includes/_sidebar.html -->
  {% include 'users/includes/_sidebar.html' %}

  <!-- Main Area -->
  <div class="flex-1 flex flex-col overflow-y-auto w-full">
    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 px-4 md:px-6 py-4 flex justify-between items-center sticky top-0 z-10 transition-colors">
      <div class="flex items-center space-x-3">
        <!-- Nút Mở Menu trên Mobile -->
        <button id="open-mobile-sidebar" class="p-1.5 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg md:hidden">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        {% block header_title %}
          <h1 class="text-lg md:text-xl font-bold text-gray-800 dark:text-gray-100">Dashboard</h1>
        {% endblock %}
      </div>

      <div class="flex items-center space-x-3 md:space-x-4">
  <!-- Nút View Site chuẩn không lo bị Safari chặn -->
<a href="{% url 'pages:home' %}" 
   onclick="if(window.innerWidth >= 768) { this.target = '_blank'; }"
   rel="noopener noreferrer"
   title="View site"
   class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-gray-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 bg-gray-100 dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-slate-700/60 rounded-lg border border-gray-200 dark:border-slate-700 transition-all shrink-0">
  <i data-lucide="globe" class="w-4 h-4 text-blue-600 dark:text-blue-400"></i>
  <span class="hidden sm:inline">View site</span>
</a>
  <!-- Nút Thông báo cũ của bạn -->
  <button class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-full relative transition-colors" title="Thông báo">
    <i data-lucide="bell" class="w-5 h-5"></i>
    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
  </button>
</div>
    </header>

    <!-- Main Content Block -->
    <main class="p-4 md:p-6 space-y-6">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    lucide.createIcons();

    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar');
    const toggleIcon = document.getElementById('toggle-icon');
    const brandHeader = document.getElementById('brand-header');
    const userFooter = document.getElementById('user-footer');
    const sidebarTexts = document.querySelectorAll('.sidebar-text');

    // Mobile Elements
    const openMobileBtn = document.getElementById('open-mobile-sidebar');
    const closeMobileBtn = document.getElementById('close-mobile-sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    // Xử lý Toggle Sidebar cho Desktop
    function toggleDesktopSidebar() {
      if (!sidebar) return;
      sidebar.classList.toggle('w-64');
      sidebar.classList.toggle('w-20');

      sidebarTexts.forEach(text => text.classList.toggle('hidden'));

      if (sidebar.classList.contains('w-20')) {
        brandHeader?.classList.remove('justify-between');
        brandHeader?.classList.add('flex-col', 'items-center', 'gap-2');
        userFooter?.classList.remove('justify-between');
        userFooter?.classList.add('justify-center');
        toggleIcon?.setAttribute('data-lucide', 'panel-left-open');
      } else {
        brandHeader?.classList.remove('flex-col', 'items-center', 'gap-2');
        brandHeader?.classList.add('justify-between');
        userFooter?.classList.remove('justify-center');
        userFooter?.classList.add('justify-between');
        toggleIcon?.setAttribute('data-lucide', 'panel-left-close');
      }

      lucide.createIcons();
    }

    // Xử lý Bật/Tắt Sidebar cho Mobile
    function openMobileSidebar() {
      sidebar?.classList.remove('-translate-x-full');
      overlay?.classList.remove('hidden');
    }

    function closeMobileSidebar() {
      sidebar?.classList.add('-translate-x-full');
      overlay?.classList.add('hidden');
    }

    toggleBtn?.addEventListener('click', toggleDesktopSidebar);
    openMobileBtn?.addEventListener('click', openMobileSidebar);
    closeMobileBtn?.addEventListener('click', closeMobileSidebar);
    overlay?.addEventListener('click', closeMobileSidebar);
  </script>
</body>
</html>

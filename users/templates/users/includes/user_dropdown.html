{% if user.is_authenticated %}
<div class="relative group py-2">
    <!-- Nút hiển thị User / Avatar -->
    <button
        class="flex items-center gap-2 text-[var(--color-text-main)] text-sm font-semibold hover:text-[var(--color-primary)] px-2 transition-colors">
        <div
            class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs border border-blue-200 overflow-hidden">

            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>

        </div>
        <span>{{ user.username }}</span>
        <svg class="w-4 h-4 text-gray-400 group-hover:rotate-180 transition-transform duration-200" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </button>

    <!-- Menu Dropdown (Mở ra khi hover vào nút) -->
    <div
        class="absolute right-0 mt-1 w-52 bg-white rounded-xl shadow-lg border border-[var(--color-border)] py-2 hidden group-hover:block z-50">
        <div class="px-4 py-2 border-b border-gray-100">
            <p class="text-xs text-gray-500">Đăng nhập với</p>
            <p class="text-sm font-bold text-gray-800 truncate">{{ user.username }}</p>
        </div>

        <!-- Trang cá nhân -->
        <a href="{% url 'users:profile' %}"
            class="flex items-center gap-2 px-4 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-50 hover:text-[var(--color-primary)] transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            Trang cá nhân
        </a>

        <!-- Dashboard / Báo cáo khảo sát -->
        <a href="{% url 'surveys:reconnect_report' %}"
             class="flex items-center gap-2 px-4 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-50 hover:text-[var(--color-primary)] transition-colors">
    <!-- Icon SVG Báo cáo/Thống kê tương thích -->
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Thống kê
            </a>
        <a href="{% url 'users:dashboard' %}"
        class="flex items-center gap-2 px-4 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-50 hover:text-[var(--color-primary)] transition-colors">
    <!-- Icon SVG Dashboard (Grid Layout) -->
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
            </svg>
            Bảng điều khiển
        </a>
        <!-- Link dành riêng cho Admin/Staff -->
        {% if user.is_staff %}
        <a href="/admin/" target="_blank"
            class="flex items-center gap-2 px-4 py-2 text-xs font-semibold text-purple-600 hover:bg-purple-50 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                </path>
            </svg>
            Quản trị Admin
        </a>
        {% endif %}

        <div class="border-t border-gray-100 my-1"></div>

        <!-- Đăng xuất -->
        <a href="{% url 'users:logout' %}"
            class="flex items-center gap-2 px-4 py-2 text-xs font-semibold text-red-500 hover:bg-red-50 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                </path>
            </svg>
            Đăng xuất
        </a>
    </div>
</div>
{% else %}
<a href="{% url 'users:login' %}"
    class="hidden md:flex text-[var(--color-text-main)] text-sm font-semibold hover:text-[var(--color-primary)] px-2 whitespace-nowrap">
    Đăng nhập
</a>
{% endif %}

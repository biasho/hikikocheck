{% extends 'base.html' %}
{% block title %}Đặt Lại Mật Khẩu{% endblock %}

{% block content %}
<div
    class="max-w-md mx-auto my-10 p-6 bg-[var(--color-card-bg)] rounded-2xl shadow-sm border border-[var(--color-border)]">
    <h2 class="text-xl font-bold text-center text-[var(--color-text-main)] mb-2">Quên Mật Khẩu?</h2>
    <p class="text-xs text-[var(--color-text-sub)] text-center mb-6">Nhập địa chỉ Email liên kết với tài khoản của bạn
        để nhận liên kết hướng dẫn cài đặt lại mật khẩu.</p>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-[var(--color-text-main)] mb-1">Địa chỉ Email</label>
            <input type="email" name="email" required
                class="w-full px-3.5 py-2 border border-[var(--color-border)] rounded-xl text-xs focus:ring-2 focus:ring-[var(--color-primary)]/20 focus:outline-none">
        </div>
        <button type="submit"
            class="w-full py-2.5 bg-[var(--color-primary)] text-white rounded-xl text-xs font-semibold hover:opacity-90 transition-all">
            Gửi liên kết khôi phục
        </button>
    </form>
</div>
{% endblock %}

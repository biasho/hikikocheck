{% extends 'base.html' %}
{% block title %}Thành Công{% endblock %}

{% block content %}
<div
    class="max-w-md mx-auto my-12 p-8 text-center bg-[var(--color-card-bg)] rounded-2xl shadow-sm border border-[var(--color-border)]">
    <span class="material-symbols-outlined text-4xl text-green-500 mb-3">check_circle</span>
    <h2 class="text-lg font-bold text-[var(--color-text-main)] mb-2">Đặt Lại Mật Khẩu Thành Công!</h2>
    <p class="text-xs text-[var(--color-text-sub)] mb-6">Mật khẩu của bạn đã được thay đổi. Bạn có thể đăng nhập ngay
        bây giờ.</p>

    <a href="{% url 'users:login' %}"
        class="inline-block px-6 py-2.5 bg-[var(--color-primary)] text-white rounded-xl text-xs font-semibold">
        Đăng nhập ngay
    </a>
</div>
{% endblock %}

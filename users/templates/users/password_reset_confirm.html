{% extends 'base.html' %}
{% block title %}Đặt Mật Khẩu Mới{% endblock %}

{% block content %}
<div
    class="max-w-md mx-auto my-10 p-6 bg-[var(--color-card-bg)] rounded-2xl shadow-sm border border-[var(--color-border)]">
    <h2 class="text-xl font-bold text-center text-[var(--color-text-main)] mb-2">Tạo Mật Khẩu Mới</h2>
    <p class="text-xs text-[var(--color-text-sub)] text-center mb-6">Vui lòng nhập mật khẩu mới hai lần để xác nhận</p>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-xs font-semibold text-[var(--color-text-main)] mb-1">{{ field.label }}</label>
            <input type="password" name="{{ field.name }}" required
                class="w-full px-3.5 py-2 border border-[var(--color-border)] rounded-xl text-xs focus:ring-2 focus:ring-[var(--color-primary)]/20 focus:outline-none">
            {% if field.errors %}
            <p class="text-[10px] text-red-500 mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit"
            class="w-full py-2.5 bg-[var(--color-primary)] text-white rounded-xl text-xs font-semibold hover:opacity-90 transition-all">
            Cập nhật mật khẩu
        </button>
    </form>
</div>
{% endblock %}
